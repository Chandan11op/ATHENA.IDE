name: CI & Desktop Packaging

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-desktop-and-website:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Type-check desktop app
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Build desktop Electron bundles
        run: npm run build

      - name: Install & verify official website
        working-directory: website
        run: |
          npm ci
          npm test
          npm run build

  package-windows:
    needs: verify-desktop-and-website
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      signing_status: ${{ steps.signing_summary.outputs.signing_status }}
      smart_app_control_compatible: ${{ steps.signing_summary.outputs.smart_app_control_compatible }}
      signing_publisher: ${{ steps.signing_summary.outputs.signing_publisher }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkgVer = (Get-Content package.json | ConvertFrom-Json).version
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          if ($pkgVer -ne $tagVer) {
            Write-Error "Tag version ($tagVer) does not match package.json version ($pkgVer)."
            exit 1
          }

      - name: Build & package Windows binaries (SignPath staging or direct certificate signing)
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          ATHENA_SIGNING_PROVIDER: ${{ vars.ATHENA_SIGNING_PROVIDER }}
          ATHENA_TIMESTAMP_URL: ${{ vars.ATHENA_TIMESTAMP_URL }}
          ATHENA_CERT_THUMBPRINT: ${{ secrets.ATHENA_CERT_THUMBPRINT }}
          ATHENA_CERT_SUBJECT: ${{ vars.ATHENA_CERT_SUBJECT }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $hasDirectCreds = (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) -or (-not [string]::IsNullOrWhiteSpace($env:ATHENA_CERT_THUMBPRINT)) -or ($env:ATHENA_SIGNING_PROVIDER -eq 'signtool')
          if ($env:SIGNPATH_ENABLED -eq 'true') {
            $env:ATHENA_SIGNING_MODE = 'signpath-staging'
            $env:ATHENA_REQUIRE_CODE_SIGNING = 'false'
            Write-Host "Building SignPath staging artifacts on GitHub-hosted runner."
          }
          elseif ($hasDirectCreds) {
            $env:ATHENA_REQUIRE_CODE_SIGNING = 'true'
            Write-Host "Building and signing Windows artifacts via signtool/certificate configuration."
          }
          else {
            $env:ATHENA_SIGNING_MODE = 'unsigned'
            $env:ATHENA_REQUIRE_CODE_SIGNING = 'false'
            Write-Warning "No Windows code-signing credentials configured; building unsigned candidate artifacts."
          }
          npm run pack:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned Windows binaries for SignPath submission
        id: upload_unsigned_signpath
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installers
          path: release/Athena.IDE-*-win-*.exe
          if-no-files-found: error

      - name: Submit Windows binaries to SignPath Foundation
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_signpath.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/signed

      - name: Stage SignPath-signed binaries into release output
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signedFiles = Get-ChildItem -Path release/signed -Filter "*.exe" -Recurse
          if ($signedFiles.Count -eq 0) {
            Write-Error "SignPath returned no signed Windows executables."
            exit 1
          }
          foreach ($f in $signedFiles) {
            Copy-Item -Path $f.FullName -Destination (Join-Path "release" $f.Name) -Force
          }

      - name: Verify Authenticode signatures and fail if required signatures are missing or invalid
        id: signing_summary
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          ATHENA_SIGNING_PROVIDER: ${{ vars.ATHENA_SIGNING_PROVIDER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          ATHENA_CERT_THUMBPRINT: ${{ secrets.ATHENA_CERT_THUMBPRINT }}
          REQUIRE_SIGNED_RELEASE: ${{ vars.REQUIRE_SIGNED_RELEASE }}
          EXPECTED_PUBLISHER: ${{ vars.ATHENA_EXPECTED_PUBLISHER }}
        run: |
          $shouldRequireSigned = ($env:SIGNPATH_ENABLED -eq 'true') -or ($env:ATHENA_SIGNING_PROVIDER -eq 'signtool') -or (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) -or (-not [string]::IsNullOrWhiteSpace($env:ATHENA_CERT_THUMBPRINT)) -or ($env:REQUIRE_SIGNED_RELEASE -eq 'true')
          $verifyArgs = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts/signing/verify-win-signatures.ps1',
            '-ReleaseDir', 'release',
            '-JsonOutputPath', 'release/windows-signing-report.json'
          )
          if ($shouldRequireSigned) {
            $verifyArgs += '-RequireSigned'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER)) {
            $verifyArgs += @('-ExpectedPublisher', $env:EXPECTED_PUBLISHER)
          }
          powershell @verifyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $report = Get-Content release/windows-signing-report.json | ConvertFrom-Json
          "signing_status=$($report.signingStatus)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "smart_app_control_compatible=$($report.smartAppControlCompatible.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $firstPub = ($report.files | Where-Object { -not $_.microsoftSigned -and $_.publisher } | Select-Object -First 1 -ExpandProperty publisher)
          "signing_publisher=$firstPub" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate & verify SHA-256 checksums
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue release/SHA256SUMS.txt
          $exeFiles = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.msi', '.zip' }
          if ($exeFiles.Count -eq 0) {
            Write-Error "No packaged Windows installer files found in release/."
            exit 1
          }
          foreach ($file in $exeFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File -FilePath "release/SHA256SUMS.txt" -Append -Encoding utf8
          }
          if (-not (Test-Path release/SHA256SUMS.txt) -or -not (Test-Path release/windows-signing-report.json)) {
            Write-Error "Required verification outputs missing."
            exit 1
          }
          Get-Content release/SHA256SUMS.txt

      - name: Upload verified Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-ide-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/windows-signing-report.json
          if-no-files-found: error

  publish-release:
    needs: package-windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: athena-ide-windows
          path: release

      - name: Validate downloaded release artifacts before publishing
        shell: pwsh
        env:
          SIGNING_STATUS: ${{ needs.package-windows.outputs.signing_status }}
          REQUIRE_SIGNED_RELEASE: ${{ vars.REQUIRE_SIGNED_RELEASE }}
        run: |
          if ($env:REQUIRE_SIGNED_RELEASE -eq 'true' -and $env:SIGNING_STATUS -ne 'signed') {
            Write-Error "Release halted: REQUIRE_SIGNED_RELEASE=true is enabled, but signing_status is '$env:SIGNING_STATUS'."
            exit 1
          }
          $setupCount = (Get-ChildItem release -Filter "Athena.IDE-*-win-*.exe").Count
          if ($setupCount -lt 1 -or -not (Test-Path release/SHA256SUMS.txt) -or -not (Test-Path release/windows-signing-report.json)) {
            Write-Error "Release artifact bundle incomplete."
            exit 1
          }

      - name: Publish GitHub Release on Tag
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_STATUS: ${{ needs.package-windows.outputs.signing_status }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $notesFile = "docs/releases/$ver.md"
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists; refusing to overwrite."
            exit 1
          }
          $files = @(Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -in @('latest.yml', 'SHA256SUMS.txt', 'windows-signing-report.json') } | Select-Object -ExpandProperty FullName)
          if ($files.Count -eq 0) { exit 1 }

          if ($env:SIGNING_STATUS -ne 'signed') {
            Write-Warning "Publishing release $tag as UNSIGNED candidate (Smart App Control incompatible)."
          }

          if (Test-Path $notesFile) {
            gh release create $tag @files --title "ATHENA.IDE $tag" --notes-file $notesFile
          } else {
            gh release create $tag @files --title "ATHENA.IDE $tag" --generate-notes
          }
